services:
  postgres:
    image: postgres:16-alpine
    container_name: sangathe_postgres
    restart: always
    environment:
      POSTGRES_USER: sangathe_admin
      POSTGRES_PASSWORD: sangathe_secret_pass
      POSTGRES_DB: sangathe_db
    ports:
      - "5432:5432"
    volumes:
      - sangathe_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sangathe_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - sangathe_redisdata:/data

volumes:
  sangathe_pgdata:
  sangathe_redisdata: